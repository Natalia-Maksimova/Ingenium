<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link rel="stylesheet" href="stylesheets/pic.css">
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <div class="wrapper">
        <div id="body"></div>
        <div id="tail"></div>
        <div id="floor"></div>
        <div id="neck"></div>

        <div class="head">
            <div class="horns"></div>
            <div class="eyes"></div>
            <div class="nose"></div>
            <div class="tooth"></div>
            <div class="tooth bottom-left-tooth"></div>
            <div class="tooth bottom-right-tooth"></div>
            <div class="tooth right-tooth"></div>
        </div>
        <div class="hand"></div>
        <div class="hand shifted"></div>
        <div class="leg"></div>
        <div class="leg shifted"></div>

        <div class="grass"></div>
        <div class="grass-mirrored"></div>

        <div class="branch">
            <div class="leaf leaf-1"></div>
            <div class="leaf leaf-2"></div>
            <div class="leaf leaf-3"></div>
        </div>
    </div>
</body>
</html>
